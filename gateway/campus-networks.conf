# Networks exempt from the gateway's per-address rate limits (sign-in, forms).
#
# Why: a campus usually reaches the internet through ONE public address, so every
# student and teacher on the college network looks like the same visitor. Without
# this, a busy morning (everyone signing in, registering for an event) would hit
# the per-address limits and people would see "Too many requests".
#
# Abuse is still limited by the services themselves (one-time codes: 5 tries per
# code and 3 codes per email per 15 minutes; Google handles its own sign-in).
#
# One line per network, ending in " 1;". Ask college IT for the campus's public
# address(es). Examples (remove the # to use):
#
# 202.166.200.0/24 1;
# 103.10.28.14 1;
