# NCIT API gateway. One upstream + one location per service.
# Adding a service = add its upstream and location; nothing else changes.

worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;

  log_format json escape=json '{"time":"$time_iso8601","request_id":"$request_id",'
    '"method":"$request_method","uri":"$request_uri","status":$status,'
    '"upstream":"$upstream_addr","duration":$request_time}';
  access_log /dev/stdout json;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # The visitor's real address. Only Caddy (fixed address 172.30.0.250, see infra/docker-compose.tls.yml)
  # is trusted to say who the visitor is; anyone else's X-Forwarded-For is ignored and replaced below.
  # Without this, rate limits behind Caddy would count every visitor as one, and anyone could put a
  # made-up address into the audit log. If you change the Docker subnet, change this address too.
  set_real_ip_from 172.30.0.250;
  real_ip_header X-Forwarded-For;
  real_ip_recursive off;   # take the address Caddy added (the last one), not what the visitor sent
  map $realip_remote_addr $forwarded_proto { 172.30.0.250 $http_x_forwarded_proto; default $scheme; }

  # Rate limits count per visitor address, except for trusted campus networks (gateway/campus-networks.conf),
  # where many people share one address. An empty key is not counted by nginx.
  geo $limit_exempt { default 0; include /etc/nginx/campus-networks.conf; }
  map $limit_exempt $limit_key { 1 ""; default $binary_remote_addr; }
  limit_req_zone $limit_key zone=auth:10m rate=20r/m;
  limit_req_status 429;
  limit_req_zone $limit_key zone=forms:10m rate=30r/m;

  proxy_cache_path /var/cache/nginx/public levels=1:2 keys_zone=public:10m max_size=200m inactive=10m;

  # Docker's internal DNS. Services get a new address whenever their container is
  # recreated (an update, a restart after a crash); "resolve" makes nginx follow the
  # change within seconds instead of sending traffic to an address now used by
  # another service. Needs nginx 1.27.3 or later (the gateway image is pinned).
  resolver 127.0.0.11 valid=5s ipv6=off;

  upstream auth_service { zone auth_service 64k; server auth-service:8000 resolve; }
  upstream audit_service { zone audit_service 64k; server audit-service:8000 resolve; }
  upstream academics_service { zone academics_service 64k; server academics-service:8000 resolve; }
  upstream content_service { zone content_service 64k; server content-service:8000 resolve; }
  upstream event_service { zone event_service 64k; server event-service:8000 resolve; }
  upstream eca_service { zone eca_service 64k; server eca-service:8000 resolve; }
  upstream admission_service { zone admission_service 64k; server admission-service:8000 resolve; }
  upstream career_service { zone career_service 64k; server career-service:8000 resolve; }
  upstream alumni_service { zone alumni_service 64k; server alumni-service:8000 resolve; }
  upstream notification_service { zone notification_service 64k; server notification-service:8000 resolve; }
  upstream search_service { zone search_service 64k; server search-service:8000 resolve; }

  map $http_x_request_id $req_id { default $http_x_request_id; "" $request_id; }
  # HSTS only when the visitor came over HTTPS (directly, or via a TLS proxy in front of this gateway)
  map $forwarded_proto $hsts { ~https "max-age=31536000; includeSubDomains"; default ""; }

  client_max_body_size 1m;   # raised only on the upload routes below
  client_body_timeout 15s;
  client_header_timeout 15s;

  server {
    listen 80;
    root /usr/share/nginx/html;

    # Security headers. These are the ONLY add_header lines: nginx drops all server-level
    # add_header lines inside any location that has its own, so locations must not add any.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security $hsts always;  # only over HTTPS (see the map above)
    add_header X-Cache-Status $upstream_cache_status always;  # HIT/MISS on cached public reads; omitted elsewhere

    proxy_set_header X-Request-ID $req_id;
    proxy_set_header X-Forwarded-For $remote_addr;   # one address: the visitor (see set_real_ip_from)
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Host $host;

    # Front end: static HTML, CSS, JS
    location / {
      try_files $uri $uri.html $uri/ =404;
      location ~* \.(css|js|woff2|png|jpg|webp|svg|ico)$ { expires 7d; }
    }

    location = /api/health { return 200 '{"status":"ok","service":"gateway"}'; default_type application/json; }

    # Versioned service routes: /api/v1/<service>/... -> service root

    # Sign-in endpoints are rate limited per IP; the rest of auth is normal traffic.
    location /api/v1/auth/google/ { limit_req zone=auth burst=10 nodelay; proxy_pass http://auth_service/google/; }
    # Emailed sign-in codes for applicants and alumni: tightly rate limited (the service also limits per address).
    location /api/v1/auth/code/   { limit_req zone=auth burst=5 nodelay; proxy_pass http://auth_service/code/; }
    location /api/v1/auth/dev/    { limit_req zone=auth burst=10 nodelay; proxy_pass http://auth_service/dev/; }
    location /api/v1/auth/        { client_max_body_size 2m; proxy_pass http://auth_service/; }

    location /api/v1/audit/       { proxy_pass http://audit_service/; }

    # Department pages: public reads are cached for 5 s here and in Redis by the service; editors' changes show at once.
    location /api/v1/academics/public/ {
      proxy_pass http://academics_service/public/;
      proxy_cache public;
      proxy_cache_methods GET HEAD;
      proxy_cache_valid 200 5s;   # a short burst absorber; the services' Redis cache does the rest
      proxy_cache_valid 404 5s;
      proxy_cache_use_stale error timeout updating;
    }
    location /api/v1/academics/ { client_max_body_size 9m; proxy_pass http://academics_service/; }

    # Photos uploaded from the dashboard (shared volume with academics-service)
    location /media/ {
      alias /usr/share/nginx/media/;
      expires 30d;
      types { image/jpeg jpg; application/pdf pdf; }
      default_type application/octet-stream;
    }

    # One template serves every department: /departments/computer, /departments/civil ...
    location ~ ^/departments/[a-z0-9-]+/?$ { try_files /department.html =404; }

    # The Contact page form: emailed to the college; tightly rate limited.
    location = /api/v1/content/public/contact { limit_req zone=auth burst=3 nodelay; proxy_pass http://content_service/public/contact; }
    # Home page content, news, notices, leadership: public reads cached briefly.
    location /api/v1/content/public/ {
      proxy_pass http://content_service/public/;
      proxy_cache public;
      proxy_cache_methods GET HEAD;
      proxy_cache_valid 200 5s;   # a short burst absorber; the services' Redis cache does the rest
      proxy_cache_valid 404 5s;
      proxy_cache_use_stale error timeout updating;
    }
    location /api/v1/content/ { client_max_body_size 11m; proxy_pass http://content_service/; }

    # News articles share one template: /news/<slug>  (/news, /notices, /leadership resolve to their .html)
    location ~ ^/news/[a-z0-9-]+/?$ { try_files /news.html =404; }

    # Events calendar and registrations. Public reads are cached briefly; signing up is rate limited.
    location /api/v1/events/public/ {
      proxy_pass http://event_service/public/;
      proxy_cache public;
      proxy_cache_methods GET HEAD;
      proxy_cache_valid 200 5s;   # a short burst absorber; the services' Redis cache does the rest
      proxy_cache_valid 404 5s;
      proxy_cache_use_stale error timeout updating;
    }
    location /api/v1/events/me/ { limit_req zone=forms burst=20 nodelay; proxy_pass http://event_service/me/; }
    location /api/v1/events/ { client_max_body_size 11m; proxy_pass http://event_service/; }
    location ~ ^/events/[a-z0-9-]+/?$ { try_files /event.html =404; }

    # Clubs, club activities and membership requests.
    location /api/v1/eca/public/ {
      proxy_pass http://eca_service/public/;
      proxy_cache public;
      proxy_cache_methods GET HEAD;
      proxy_cache_valid 200 5s;   # a short burst absorber; the services' Redis cache does the rest
      proxy_cache_valid 404 5s;
      proxy_cache_use_stale error timeout updating;
    }
    location /api/v1/eca/me/ { limit_req zone=forms burst=20 nodelay; proxy_pass http://eca_service/me/; }
    location /api/v1/eca/ { client_max_body_size 9m; proxy_pass http://eca_service/; }
    location ~ ^/clubs/[a-z0-9-]+/?$ { try_files /club.html =404; }

    # Admissions: open intakes (cached), the applicant's own application, and the officers' review.
    location /api/v1/admissions/public/ {
      proxy_pass http://admission_service/public/;
      proxy_cache public;
      proxy_cache_methods GET HEAD;
      proxy_cache_valid 200 5s;   # a short burst absorber; the services' Redis cache does the rest
      proxy_cache_valid 404 5s;
      proxy_cache_use_stale error timeout updating;
    }
    location /api/v1/admissions/me/ { limit_req zone=forms burst=30 nodelay; client_max_body_size 11m; proxy_pass http://admission_service/me/; }
    location /api/v1/admissions/ { client_max_body_size 11m; proxy_pass http://admission_service/; }

    # Careers: vacancies (cached), applying with a CV, and HR review.
    location /api/v1/careers/public/ {
      proxy_pass http://career_service/public/;
      proxy_cache public;
      proxy_cache_methods GET HEAD;
      proxy_cache_valid 200 5s;   # a short burst absorber; the services' Redis cache does the rest
      proxy_cache_valid 404 5s;
      proxy_cache_use_stale error timeout updating;
    }
    location /api/v1/careers/me/ { limit_req zone=forms burst=30 nodelay; client_max_body_size 11m; proxy_pass http://career_service/me/; }
    location /api/v1/careers/ { client_max_body_size 11m; proxy_pass http://career_service/; }

    # Alumni: the public directory (cached), alumni profiles, and verification.
    location /api/v1/alumni/public/ {
      proxy_pass http://alumni_service/public/;
      proxy_cache public;
      proxy_cache_methods GET HEAD;
      proxy_cache_valid 200 5s;   # a short burst absorber; the services' Redis cache does the rest
      proxy_cache_valid 404 5s;
      proxy_cache_use_stale error timeout updating;
    }
    location /api/v1/alumni/me/ { limit_req zone=forms burst=30 nodelay; client_max_body_size 9m; proxy_pass http://alumni_service/me/; }
    location /api/v1/alumni/ { client_max_body_size 9m; proxy_pass http://alumni_service/; }

    # Site search (cached briefly) and the sitemap built from the search index.
    location /api/v1/search/public/ {
      proxy_pass http://search_service/public/;
      proxy_cache public;
      proxy_cache_methods GET HEAD;
      proxy_cache_valid 200 5s;   # a short burst absorber; the services' Redis cache does the rest
      proxy_cache_use_stale error timeout updating;
    }
    location /api/v1/search/ { proxy_pass http://search_service/; }
    location = /sitemap.xml {
      proxy_pass http://search_service/sitemap.xml;
      proxy_cache public;
      proxy_cache_valid 200 10m;
      proxy_cache_use_stale error timeout updating;
    }

    # Email log (Super Admin)
    location /api/v1/notify/ { proxy_pass http://notification_service/; }
    location ~ ^/careers/[a-z0-9-]+/?$ { try_files /job.html =404; }
  }
}
