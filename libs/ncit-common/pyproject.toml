[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ncit-common"
version = "0.1.0"
description = "Shared auth, error and logging helpers for NCIT Flask microservices"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0",
    "PyJWT[crypto]>=2.8",
]

[project.optional-dependencies]
media = ["Pillow>=10"]
editor = ["SQLAlchemy>=2"]
dev = ["pytest>=8", "cryptography>=42", "Pillow>=10", "SQLAlchemy>=2"]

[tool.setuptools.packages.find]
include = ["ncit_common*"]
